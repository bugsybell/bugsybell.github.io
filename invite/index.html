<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Join a Circle on Circa</title>
<style>
  :root { color-scheme: light dark; --bg:#faf7f2; --fg:#2b2622; --muted:#7a7068; --accent:#b4632f; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1d1a17; --fg:#f3ede6; --muted:#a39a90; --accent:#e08a55; } }
  html,body { margin:0; background:var(--bg); color:var(--fg); font:17px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
  main { max-width:420px; margin:0 auto; padding:18vh 24px 48px; text-align:center; }
  h1 { font-size:28px; font-weight:600; letter-spacing:-0.01em; margin:0 0 12px; }
  p { color:var(--muted); margin:0 0 28px; }
  a.button { display:inline-block; background:var(--accent); color:#fff; text-decoration:none; font-weight:600; padding:14px 28px; border-radius:14px; }
  small { display:block; margin-top:32px; color:var(--muted); font-size:14px; }
</style>
</head>
<body>
<main>
  <h1>You’ve been invited to a Circle</h1>
  <p>Circa is a private place to share moments with the people who matter. Open this invitation in the Circa app to join.</p>
  <a class="button" id="open" href="circa://invite">Open in Circa</a>
  <small>Don’t have Circa yet? It’s currently in private testing — install it from TestFlight, then open this link again.</small>
</main>
<script>
  // The invitation token lives only in the URL fragment, which browsers never
  // send to a server. It is used here solely to hand the link to the app.
  // Nothing is stored, logged or sent anywhere.
  var t = location.hash.replace(/^#/, "");
  if (t) document.getElementById("open").href = "circa://invite?token=" + encodeURIComponent(t);
</script>
</body>
</html>
